[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bard-cpac"
version = "0.1.0"
description = "BARD after-score pipeline: audio performance analysis to story and live visuals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47.0",
  "onnxruntime>=1.17.0",
  "Pillow>=10.0.0",
  "soundfile>=0.13.1",
  "pygame>=2.6.1",
  "python-dotenv>=1.0.1",
  "python-osc>=1.9.3",
  "rembg>=2.0.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]
cloud = [
  "google-cloud-storage>=2.18.0",
  "google-genai>=2.10.0",
]
local-ai = [
  "accelerate>=0.31.0",
  "bitsandbytes>=0.43.0",
  "librosa>=0.10.2",
  "numpy>=1.26.0",
  "protobuf",
  "sentencepiece",
  "torch>=2.3.0",
  "transformers>=4.41.0",
]
voice = [
  "edge-tts>=7.0.0",
  "pygame>=2.6.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
bard = "bard_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
