services:
  bard:
    build:
      context: .
    image: bard-cpac:local
    working_dir: /workspace
    entrypoint: ["python", "-m", "bard_core"]
    volumes:
      - .:/workspace
    ports:
      - "5007:5007/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BARD_OUTPUT_DIR: /workspace/runs
      BARD_OSC_HOST: host.docker.internal
      BARD_OSC_PORT: 5005
      BARD_OSC_READY_PORT: 5007
      BARD_OSC_READY_BIND_HOST: 0.0.0.0
      BARD_CONTAINER_WORKSPACE: /workspace
      BARD_HOST_WORKSPACE: ${BARD_HOST_WORKSPACE}
      PYTHONUNBUFFERED: "1"
